<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Tokyo → Paris · aller simple fin janvier 2027</title>
<style>
:root{
  --bg:#f6f7f9;--surface:#fff;--surface-2:#f1f3f6;--text:#14171c;--muted:#5d6673;--line:#e3e6eb;
  --accent:#2457d6;--accent-soft:#e8eefc;--ok:#127a46;--ok-soft:#e3f4ea;--warn:#9a5b00;--warn-soft:#fdf1dc;
  --bar:#c9d4ea;--bar-stop:#9aa7bf;--shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --r:12px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0f1216;--surface:#171b21;--surface-2:#1e232b;--text:#e8ebef;--muted:#9aa3ae;--line:#2a3039;
  --accent:#7ea2ff;--accent-soft:#1d2840;--ok:#5fd394;--ok-soft:#14291e;--warn:#f2b552;--warn-soft:#2c2414;
  --bar:#2f3a4f;--bar-stop:#56647d;--shadow:none}}
:root[data-theme=dark]{
  --bg:#0f1216;--surface:#171b21;--surface-2:#1e232b;--text:#e8ebef;--muted:#9aa3ae;--line:#2a3039;
  --accent:#7ea2ff;--accent-soft:#1d2840;--ok:#5fd394;--ok-soft:#14291e;--warn:#f2b552;--warn-soft:#2c2414;
  --bar:#2f3a4f;--bar-stop:#56647d;--shadow:none}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
a{color:var(--accent)}
.wrap{max-width:1120px;margin:0 auto;padding:28px 20px 60px}
header{display:flex;gap:16px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:18px;margin:40px 0 12px}
.sub{color:var(--muted);margin:0}
.btn-ghost{background:var(--surface);border:1px solid var(--line);color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer;font:inherit}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:22px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .l{font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi .v{font-size:26px;font-weight:650;margin-top:2px}
.kpi .d{font-size:13px;color:var(--muted)}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.pick .tag{align-self:flex-start;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pick .t{font-weight:650;font-size:17px}
.pick .p{font-size:24px;font-weight:700}
.pick .m{color:var(--muted);font-size:13.5px}
.pick .act{margin-top:auto;padding-top:8px;display:flex;gap:8px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:6px;background:var(--accent);color:#fff;text-decoration:none;border-radius:8px;padding:7px 12px;font-weight:600;font-size:14px}
:root[data-theme=dark] .cta{color:#0f1216}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cta{color:#0f1216}}
.cta.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
.filters{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);padding:12px 0;margin-top:8px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--text);border-radius:999px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme=dark] .chip[aria-pressed=true]{color:#0f1216}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .chip[aria-pressed=true]{color:#0f1216}}
.f{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.f input[type=range]{width:150px;accent-color:var(--accent)}
.f output{color:var(--text);font-weight:600;min-width:40px}
select,input[type=search]{font:inherit;font-size:14px;background:var(--surface);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
input[type=checkbox]{accent-color:var(--accent);width:16px;height:16px}
.count{margin:14px 0 8px;color:var(--muted);font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.row.ok{border-left:4px solid var(--ok)}
.row.ko{opacity:.72}
.main{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(200px,2fr) minmax(110px,.9fr) auto;gap:16px;align-items:center;padding:14px 16px}
.cie{font-weight:600}
.dt{font-size:13px;color:var(--muted)}
.times{display:flex;align-items:center;gap:10px}
.times b{font-size:17px}
.track{flex:1;min-width:60px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--bar)}
.bar i{position:absolute;top:-3px;width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--bar-stop);transform:translateX(-50%)}
.tl{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted);margin-top:5px}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.b.ok{background:var(--ok-soft);color:var(--ok)}
.b.warn{background:var(--warn-soft);color:var(--warn)}
.price{text-align:right}
.price .v{font-size:22px;font-weight:700}
.price .s{font-size:12.5px;color:var(--muted)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
details{border-top:1px solid var(--line)}
summary{cursor:pointer;padding:8px 16px;font-size:13.5px;color:var(--muted);list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";}
details[open] summary::before{content:"▾ "}
.obs{padding:0 16px 12px;display:grid;gap:4px;font-size:14px}
.obs div{display:flex;justify-content:space-between;gap:12px}
.note{font-size:13.5px;color:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;font-size:14px}
th,td{text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--surface-2);font-weight:600;font-size:13px;color:var(--muted)}
.links{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:8px}
.links a{display:block;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;text-decoration:none;color:var(--text)}
.links a:hover{border-color:var(--accent)}
.links a span{display:block;font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{margin-top:40px;color:var(--muted);font-size:13px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.cta.sec,:root[data-theme=dark] .cta.sec{background:transparent;color:var(--accent);border:1px solid var(--line)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .cta.sec{color:var(--accent)}}
html,body{overflow-x:hidden}
.main>*,.kpi,.pick,.links a{min-width:0}
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r)}
@media (max-width:760px){
  .wrap{padding:18px 14px 48px}
  h1{font-size:22px}
  h2{font-size:17px;margin-top:30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .kpi{padding:11px 12px}
  .kpi .v{font-size:21px}
  .kpi .l{font-size:11px}
  .picks{grid-template-columns:1fr}
  .filters{position:static;gap:10px}
  .chips{flex-wrap:nowrap;overflow-x:auto;width:100%;padding-bottom:2px;scrollbar-width:none}
  .chip{flex:none}
  .f input[type=range]{flex:1;width:auto}
  .filters>label:first-of-type{width:100%}
  input[type=search]{width:100%}
  .main{grid-template-columns:1fr;gap:10px;padding:13px 14px}
  .price{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;border-top:1px solid var(--line);padding-top:10px}
  .price .acts{margin-top:0}
  .links{grid-template-columns:1fr}
  .cta{padding:9px 13px}
  th,td{padding:9px 10px}
  table{min-width:560px}
}
</style>
</head>

const $ = s => document.querySelector(s);
const eur = n => n.toLocaleString("fr-FR") + " €";
const dur = m => `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`;
const jour = d => new Date(d + "T12:00:00").toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
const esc = s => String(s ?? "").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const MAXD = 21*60;
const V = DATA.vols;
const ok = V.filter(v => v.duree <= MAXD && !v.autonome);
const minBy = (a,f) => a.reduce((x,y)=>f(y)<f(x)?y:x);

/* thème */
const root = document.documentElement;
const saved = localStorage.getItem("theme"); if (saved) root.dataset.theme = saved;
$("#theme").onclick = () => {
  const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  root.dataset.theme = dark ? "light" : "dark"; localStorage.setItem("theme", root.dataset.theme);
};

$("#sub").textContent = `Fin janvier 2027 · 1 adulte · économique · critère ≤ 21 h · relevé du ${DATA.releve}`;

/* chiffres clés */
const pick1 = a => a.length ? a : null;
const cheap = ok.length ? minBy(ok, v=>v.prix) : null;
const directs = ok.filter(v=>v.escales===0);
const cheapDirect = directs.length ? minBy(directs, v=>v.prix) : null;
const kp = [];
if (cheap) kp.push(["Meilleur prix ≤ 21 h", eur(cheap.prix), `${cheap.compagnie} · ${dur(cheap.duree)} · ${jour(cheap.date)}`]);
if (cheapDirect) kp.push(["Direct le moins cher", eur(cheapDirect.prix), `${cheapDirect.compagnie} · ${dur(cheapDirect.duree)}`]);
if (cheap && cheapDirect) kp.push(["Écart escale / direct", eur(cheapDirect.prix - cheap.prix), "pour gagner " + dur(Math.max(0, cheap.duree - cheapDirect.duree))]);
kp.push(["Vols ≤ 21 h trouvés", ok.length, `sur ${V.length} vols uniques relevés`]);
$("#kpis").innerHTML = kp.map(([l,v,d])=>`<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="d">${esc(d)}</div></div>`).join("");

/* recommandations */
const value = v => v.prix + (v.duree/60)*25; // 25 € par heure de voyage
const others = ok.filter(v=>v!==cheap);
const picks = [
  ["Le moins cher", cheap, "Le meilleur prix qui respecte vos 21 h."],
  ["Meilleur compromis", others.length ? minBy(others, value) : null, "Prix et durée pondérés (1 h de trajet = 25 €)."],
  ["Le plus confortable", cheapDirect, "Vol direct, aucune escale, environ 14 h 30."],
].filter(p=>p[1]);
$("#picks").innerHTML = picks.map(([tag,v,why])=>`
  <article class="pick">
    <span class="tag">${tag}</span>
    <div class="t">${esc(v.compagnie)}</div>
    <div class="p">${eur(v.prix)}</div>
    <div class="m">${jour(v.date)} · ${v.depart} → ${v.arrivee} · ${dur(v.duree)} · ${v.escales?("escale "+esc(v.via)):"direct"}</div>
    <div class="m">${why}</div>
    ${v.note?`<div class="note">${esc(v.note)}</div>`:""}
    <div class="act"><a class="cta" href="${v.lien}" target="_blank" rel="noopener">Voir l'offre ↗</a>${v.site?`<a class="cta sec" href="${v.site}" target="_blank" rel="noopener">Site compagnie</a>`:""}</div>
  </article>`).join("");

/* filtres */
const dates = [...new Set(V.map(v=>v.date))].sort();
const st = {date:"2027-01-28", dur:21, direct:false, noauto:true, sort:"prix", q:""};
$("#dates").innerHTML = ["tous",...dates].map(d=>`<button class="chip" type="button" data-d="${d}" aria-pressed="${d===st.date}">${d==="tous"?"Toutes dates":jour(d)}</button>`).join("");
$("#dates").onclick = e => { const b=e.target.closest(".chip"); if(!b) return; st.date=b.dataset.d;
  document.querySelectorAll("#dates .chip").forEach(c=>c.setAttribute("aria-pressed", c===b)); render(); };
$("#dur").oninput = e => { st.dur=+e.target.value; $("#durv").textContent = st.dur.toString().replace(".",",")+" h"; render(); };
$("#direct").onchange = e => { st.direct=e.target.checked; render(); };
$("#noauto").onchange = e => { st.noauto=e.target.checked; render(); };
$("#sort").onchange = e => { st.sort=e.target.value; render(); };
$("#q").oninput = e => { st.q=e.target.value.trim().toLowerCase(); render(); };

const maxDur = Math.max(...V.map(v=>v.duree));
function row(v){
  const okd = v.duree <= MAXD;
  const w = Math.max(18, v.duree/maxDur*100);
  const stops = (v.via||"").split(",").filter(Boolean);
  const dots = stops.map((s,i)=>`<i style="left:${(i+1)/(stops.length+1)*100}%" title="${esc(s.trim())}"></i>`).join("");
  const badges = [
    okd?'<span class="b ok">≤ 21 h</span>':'<span class="b">> 21 h</span>',
    v.escales===0?'<span class="b ok">Direct</span>':`<span class="b">${v.escales} escale${v.escales>1?"s":""}</span>`,
    v.autonome?'<span class="b warn">Correspondance autonome</span>':"",
  ].join("");
  const obs = [...v.obs].sort((a,b)=>a.prix-b.prix).map(o=>`<div><a href="${o.lien}" target="_blank" rel="noopener">${esc(o.source)}</a><b>${eur(o.prix)}</b></div>`).join("");
  return `<article class="row ${okd?"ok":"ko"}">
    <div class="main">
      <div><div class="cie">${esc(v.compagnie)}</div><div class="dt">${jour(v.date)} · ${esc(v.aeroports)}</div></div>
      <div class="mid">
        <div class="times"><b>${v.depart}</b><div class="track"><div class="bar" style="width:${w}%">${dots}</div></div><b>${v.arrivee}</b></div>
        <div class="tl"><span>${dur(v.duree)}</span><span>${stops.length?esc(v.via)+" · "+esc(v.escale_detail):"sans escale"}</span></div>
      </div>
      <div class="stops badges">${badges}</div>
      <div class="price"><div><div class="v">${eur(v.prix)}</div><div class="s">${esc(v.source)}</div></div>
        <div class="acts"><a class="cta" href="${v.lien}" target="_blank" rel="noopener">Voir ↗</a>${v.site?`<a class="cta sec" href="${v.site}" target="_blank" rel="noopener" aria-label="Site de ${esc(v.compagnie)}">Compagnie</a>`:""}</div>
      </div>
    </div>
    ${v.note?`<div class="note" style="padding:0 16px 10px">${esc(v.note)}</div>`:""}
    <details><summary>${v.obs.length} relevé${v.obs.length>1?"s":""}${v.prix_max>v.prix?` · jusqu'à ${eur(v.prix_max-v.prix)} d'écart selon la source`:""}</summary><div class="obs">${obs}</div></details>
  </article>`;
}
function render(){
  let r = V.filter(v =>
    (st.date==="tous" || v.date===st.date) && v.duree <= st.dur*60 &&
    (!st.direct || v.escales===0) && (!st.noauto || !v.autonome) &&
    (!st.q || (v.compagnie+" "+v.via+" "+v.aeroports).toLowerCase().includes(st.q)));
  const k = {prix:v=>v.prix, duree:v=>v.duree, depart:v=>v.date+v.depart, valeur:value}[st.sort];
  r.sort((a,b)=>k(a)<k(b)?-1:k(a)>k(b)?1:a.prix-b.prix);
  $("#count").textContent = `${r.length} vol${r.length>1?"s":""} affiché${r.length>1?"s":""}`;
  $("#list").innerHTML = r.length ? r.map(row).join("") : '<div class="empty">Aucun vol ne correspond. Élargissez la durée ou la date.</div>';
}
render();

$("#links").innerHTML = DATA.liens.map(([n,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(n)}<span>${esc(new URL(u).hostname)}</span></a>`).join("");
$("#tech").innerHTML = DATA.techniques.map(t=>`<tr>${t.map((c,i)=>i===0?`<td><b>${esc(c)}</b></td>`:`<td>${esc(c)}</td>`).join("")}</tr>`).join("");
if (DATA.histo && DATA.histo.length) {
  const f = x => x ? `${eur(x[0])} <span style="color:var(--muted)">${esc(x[1])}</span>` : "-";
  $("#histo").innerHTML = [...DATA.histo].reverse().map(h=>`<tr><td>${esc(h.releve)} (${esc(h.machine)})</td><td>${f(h.escale)}</td><td>${f(h.direct)}</td></tr>`).join("");
  $("#histo-sec").hidden = false;
}
$("#foot").innerHTML = `Prix pour 1 adulte en économique, taxes incluses, bagages en soute non garantis. Relevé du ${esc(DATA.releve)}, source : ${esc(DATA.sources)}. Les prix évoluent plusieurs fois par jour : les liens relancent la recherche en direct. Une « correspondance autonome » combine des billets séparés, sans protection en cas de retard.`;
</script>
</body>
</html>
