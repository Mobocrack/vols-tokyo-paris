<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mes vols</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Tableau des départs de la famille : un panneau par voyage suivi, le prix du jour à droite. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6779; --line:#dce1e9; --hover:#f6f8fb;
  --sign:#0f1b2d; --sign-ink:#ffffff; --sign-muted:#a9b6c9; --yellow:#ffc72c;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1220; --surface:#101b2c; --ink:#e8edf4; --muted:#94a2b6; --line:#22324a; --hover:#14223a; --sign:#13233a; color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1220; --surface:#101b2c; --ink:#e8edf4; --muted:#94a2b6; --line:#22324a; --hover:#14223a; --sign:#13233a; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--text);-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--yellow);outline-offset:3px;border-radius:6px}
.sign{background:var(--sign);color:var(--sign-ink);padding-top:env(safe-area-inset-top,0px)}
.sign .wrap{padding-block:30px 32px}
.top{display:flex;justify-content:flex-end;gap:18px;margin-bottom:14px;font-size:14px}
.top a,.top button{color:var(--sign-muted);text-decoration:none;background:none;border:0;font:inherit;cursor:pointer;padding:0}
.top a{color:var(--yellow);font-weight:600}
.top button:hover{color:var(--sign-ink)}
[hidden]{display:none!important}
.eyebrow{font:600 12px/1 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
h1{font:700 clamp(48px,10vw,80px)/.95 var(--display);margin:10px 0 0;letter-spacing:.01em}
.sign p{color:var(--sign-muted);margin:10px 0 0;max-width:55ch}
main .wrap{padding-block:28px 56px;display:grid;gap:14px}
h2{font:600 24px/1.1 var(--display);margin:22px 0 4px}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 24px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.trip:hover{border-color:var(--ink);transform:translateY(-1px)}
.trip.off{opacity:.65}
.codes{font:700 40px/1 var(--display);letter-spacing:.02em;display:flex;gap:.2em;align-items:center}
.codes span{color:var(--muted);font-weight:500}
.name{font-weight:600;margin-top:6px}
.sum{color:var(--muted);font-size:14px}
.price{text-align:right}
.price b{display:block;font:700 40px/1 var(--display)}
.price small{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.price .none{font:500 14px var(--text);color:var(--muted)}
.meta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 18px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.empty{color:var(--muted)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px;margin-top:26px}
@media (max-width:600px){
  .trip{grid-template-columns:1fr}
  .price{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="sign">
  <div class="wrap">
    <nav class="top" id="top" hidden><a href="gerer/">Gérer les voyages</a><button type="button" id="logout">Se déconnecter</button></nav>
    <div class="eyebrow">Départs suivis</div>
    <h1>Mes vols</h1>
    <p>Les prix de chaque voyage sont relevés automatiquement tous les jours. Touchez un voyage pour voir tous les vols.</p>
  </div>
</header>
<main><div class="wrap" id="list"></div></main>
<script>
const DATA = {"projets": [{"id": "japon-retour-2027", "nom": "Retour du Japon", "actif": true, "type": "aller", "origine": {"code": "TYO", "nom": "Tokyo", "aeroports": "HND,NRT"}, "destination": {"code": "PAR", "nom": "Paris", "aeroports": "CDG,ORY"}, "resume": "Aller simple · 28 janv. 2027 (± 1 j) · 1 adulte · économique · 21 h max", "date_aller": "2027-01-28", "date_retour": "", "duree_max_h": 21, "passagers": 1, "passagers_txt": "1 adulte", "meilleur": {"prix": 500, "prix_total": 500, "compagnie": "Air China", "date": "2027-01-28", "duree": 1080, "escales": 1, "via": "PEK"}, "releve": "26/11/2026 09:01 (PC)", "nb_ok": 94}], "gestion": false};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => Math.round(n).toLocaleString("fr-FR") + " €";
const dur = m => `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`;
const day = d => new Date(d+"T12:00:00").toLocaleDateString("fr-FR", {weekday:"short", day:"numeric", month:"short"});
function carte(p){
  const m = p.meilleur;
  const prix = m
    ? `<b>${eur(m.prix)}</b><small>${p.passagers > 1 ? `par personne, ${eur(m.prix_total)} au total` : "le moins cher aujourd'hui"}</small>`
    : `<span class="none">${p.releve ? "Aucun vol dans vos critères" : "Premier relevé à venir"}</span>`;
  const detail = m ? `${esc(m.compagnie)} · ${esc(day(m.date))} · ${dur(m.duree)} · ${m.escales ? "escale à " + esc(m.via) : "direct"}` : "";
  return `<a class="trip${p.actif ? "" : " off"}" href="${encodeURIComponent(p.id)}/">
    <div>
      <div class="codes">${esc(p.origine.code)} <span>${p.type === "ar" ? "⇄" : "→"}</span> ${esc(p.destination.code)}</div>
      <div class="name">${esc(p.nom)}</div>
      <div class="sum">${esc(p.resume)}</div>
    </div>
    <div class="price">${prix}</div>
    <div class="meta">${detail ? `<span>${detail}</span>` : ""}${p.releve ? `<span>Relevé du ${esc(p.releve.replace(/\s*\(.*\)$/, ""))}</span>` : ""}${p.actif ? "" : "<span>Archivé : plus relevé</span>"}</div>
  </a>`;
}
if (DATA.gestion) {
  document.getElementById("top").hidden = false;
  document.getElementById("logout").onclick = () => {
    try { localStorage.removeItem("vols.cles"); sessionStorage.removeItem("vols.cles"); } catch (e) {}
    location.reload();
  };
}
const actifs = DATA.projets.filter(p => p.actif), archives = DATA.projets.filter(p => !p.actif);
document.getElementById("list").innerHTML =
  (actifs.length ? actifs.map(carte).join("") : '<p class="empty">Aucun voyage suivi pour le moment.</p>') +
  (archives.length ? `<h2>Archivés</h2>` + archives.map(carte).join("") : "") +
  `<footer>Prix par personne, taxes comprises, relevés chaque jour sur plusieurs comparateurs. Les bagages en soute ne sont pas toujours inclus.</footer>`;
</script>
</body>
</html>
