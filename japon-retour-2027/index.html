<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Mes vols</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Signalétique d'aéroport : bandeau bleu nuit et jaune en tête, carte d'embarquement pour le meilleur vol,
   puis un tableau des départs sobre. Le jaune n'apparaît que sur le bleu nuit. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --ink:#0f1b2d; --muted:#5b6779; --line:#dce1e9; --hover:#f6f8fb;
  --sign:#0f1b2d; --sign-ink:#ffffff; --sign-muted:#a9b6c9; --yellow:#ffc72c;
  --btn:#0f1b2d; --btn-ink:#ffffff; --link:#1f4fbf;
  --ok:#1d7a4c; --ok-bg:#e4f3ea; --warn:#8f5600; --warn-bg:#fbf0db;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --text:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --r:14px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1220; --surface:#101b2c; --ink:#e8edf4; --muted:#94a2b6; --line:#22324a; --hover:#14223a;
  --sign:#13233a; --sign-ink:#ffffff; --sign-muted:#a9b6c9;
  --btn:#ffc72c; --btn-ink:#0a1220; --link:#8fb0ff;
  --ok:#5cc98d; --ok-bg:#13291f; --warn:#f0b455; --warn-bg:#2a2214; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a1220; --surface:#101b2c; --ink:#e8edf4; --muted:#94a2b6; --line:#22324a; --hover:#14223a;
  --sign:#13233a; --sign-ink:#ffffff; --sign-muted:#a9b6c9;
  --btn:#ffc72c; --btn-ink:#0a1220; --link:#8fb0ff;
  --ok:#5cc98d; --ok-bg:#13291f; --warn:#f0b455; --warn-bg:#2a2214; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--text);-webkit-font-smoothing:antialiased}
a{color:var(--link)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
:focus-visible{outline:2px solid var(--link);outline-offset:2px;border-radius:4px}

/* bandeau */
.sign{background:var(--sign);color:var(--sign-ink);padding-top:env(safe-area-inset-top,0px)}
.sign .wrap{padding-block:22px 30px;display:flex;flex-wrap:wrap;gap:14px 40px;align-items:flex-end;justify-content:space-between}
.back{flex-basis:100%;font-size:13.5px;color:var(--sign-muted);text-decoration:none}
.back:hover{color:var(--sign-ink)}
.eyebrow{font:600 12px/1.3 var(--text);letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)}
.route{font:700 clamp(54px,11vw,92px)/.9 var(--display);letter-spacing:.01em;margin:10px 0 0;display:flex;align-items:center;gap:.18em}
.route .arrow{color:var(--yellow);font-weight:500}
.route-sub{color:var(--sign-muted);margin:8px 0 0;font-size:15px;max-width:60ch}
.update{text-align:right;font-size:13px;color:var(--sign-muted)}
.update b{display:block;font:600 22px/1.2 var(--display);color:var(--sign-ink);letter-spacing:.02em}

main .wrap{padding-block:28px 56px;display:grid;gap:44px}
main .wrap>*{min-width:0}
h2{font:600 26px/1.1 var(--display);letter-spacing:.01em;margin:0 0 14px;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:62ch}

/* carte d'embarquement */
.pass{display:grid;grid-template-columns:1fr 240px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:0 1px 2px rgba(15,27,45,.05),0 8px 24px -12px rgba(15,27,45,.18)}
.pass-main{padding:22px 26px;min-width:0;display:grid;gap:18px}
.pass-stub{padding:22px 24px;border-left:2px dashed var(--line);display:flex;flex-direction:column;justify-content:space-between;gap:16px;position:relative}
.pass-stub::before,.pass-stub::after{content:"";position:absolute;left:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pass-stub::before{top:-11px}.pass-stub::after{bottom:-11px}
.tag{display:inline-block;font:600 12px/1.3 var(--text);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.leg{display:grid;grid-template-columns:auto 1fr auto;align-items:end;gap:18px;margin:10px 0 10px}
.leg .pt b{display:block;font:700 44px/1 var(--display);letter-spacing:.02em}
.leg .pt span{font:600 20px/1.2 var(--mono)}
.leg .pt span sup{font-size:12px;color:var(--muted);margin-left:2px}
.leg .pt.end{text-align:right}
.leg.small .pt b{font-size:30px}
.leg.small .pt span{font-size:16px}
.path{position:relative;height:2px;background:var(--line);margin-bottom:14px}
.path i{position:absolute;top:50%;width:10px;height:10px;border-radius:50%;background:var(--surface);border:2px solid var(--muted);transform:translate(-50%,-50%)}
.path em{position:absolute;top:-22px;transform:translateX(-50%);font:500 12px var(--mono);color:var(--muted);font-style:normal;white-space:nowrap}
.path .dur{left:50%;top:12px;color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--muted);font-size:14px}
.facts b{color:var(--ink);font-weight:600}
.price-big{font:700 52px/1 var(--display);letter-spacing:.01em}
.price-src{color:var(--muted);font-size:13px;margin-top:4px}
.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600;font-size:14px;border-radius:999px;padding:11px 18px;transition:transform .15s}
.btn:hover{transform:translateY(-1px)}
.flag{display:inline-block;font-size:12.5px;font-weight:500;padding:3px 9px;border-radius:999px;background:var(--warn-bg);color:var(--warn)}
.flag.ok{background:var(--ok-bg);color:var(--ok)}

.alts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.alt{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:grid;grid-template-columns:1fr auto;gap:4px 16px;align-items:center}
.alt .t{grid-column:1/-1}
.alt .who{font-weight:600}
.alt .det{color:var(--muted);font-size:13.5px}
.alt .p{font:700 30px/1 var(--display);text-align:right}
.alt a{grid-column:2;justify-self:end;font-size:13.5px;font-weight:600;text-decoration:none}

/* barre de filtres */
.tools{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:6px}
.tools>*{min-width:0;max-width:100%}
.days{display:flex;border:1px solid var(--line);border-radius:12px;background:var(--surface);overflow-x:auto;scrollbar-width:none}
.day{border:0;background:none;color:var(--ink);font:inherit;cursor:pointer;padding:9px 16px;text-align:left;white-space:nowrap;border-right:1px solid var(--line)}
.day:last-child{border-right:0}
.day small{display:block;font:500 12px var(--mono);color:var(--muted)}
.day[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.8}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;font-size:14px;color:var(--muted)}
.opts label{display:inline-flex;gap:7px;align-items:center;cursor:pointer}
.opts input{accent-color:var(--ink);width:16px;height:16px}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:7px 10px}
.count{font-size:13.5px;color:var(--muted);margin:10px 0 0}

/* tableau des départs */
.board{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:10px}
.cols,.row>summary{display:grid;grid-template-columns:96px 150px 76px minmax(0,1.1fr) minmax(0,1.3fr) 96px 22px;gap:14px;align-items:center;padding:12px 18px}
.cols{font:600 11.5px/1 var(--text);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);padding-block:12px}
.cols .r{text-align:right}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row.off{opacity:.6}
.row>summary{cursor:pointer;list-style:none}
.row>summary::-webkit-details-marker{display:none}
.row>summary:hover{background:var(--hover)}
.c-date{font:500 13px var(--mono);color:var(--muted);white-space:nowrap}
.c-time,.c-dur{display:grid;gap:4px}
.c-time span{font:600 16px var(--mono);white-space:nowrap}
.c-time sup{font-size:11px;color:var(--muted)}
.c-time .ret,.c-dur .ret{font-size:14px;color:var(--muted)}
.c-dur span{font:500 14px var(--mono)}
.c-stop{font-size:14px;min-width:0;display:grid;gap:4px}
.c-stop small{color:var(--muted);font-size:12.5px}
.c-cie{min-width:0;font-weight:500}
.c-cie .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:3px}
.c-price{text-align:right}
.c-price b{display:block;font:700 22px/1 var(--display)}
.c-price small{font-size:12px;color:var(--muted)}
.chev{color:var(--muted);transition:transform .2s;text-align:right}
.row[open] .chev{transform:rotate(90deg)}
.sites{padding:2px 18px 16px;display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.site{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;text-decoration:none;color:var(--ink);font-size:14px}
.site:hover{border-color:var(--ink)}
.site b{font:600 15px var(--mono)}
.site.best{border-color:var(--ok)}
.empty{padding:36px 18px;text-align:center;color:var(--muted)}

/* évolution */
.chart{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart .meta{display:flex;flex-wrap:wrap;gap:6px 24px;font-size:14px;color:var(--muted);margin-bottom:10px}
.chart .meta b{color:var(--ink);font:600 15px var(--mono)}

/* infos */
.notes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.notes h3{font:600 18px/1.2 var(--display);margin:0 0 6px;letter-spacing:.01em}
.notes p{margin:0;color:var(--muted);font-size:14px}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{font-size:14px;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px}
.links a:hover{border-color:var(--ink)}
footer{color:var(--muted);font-size:13px;border-top:1px solid var(--line);padding-top:18px;max-width:75ch}

@media (max-width:760px){
  .sign .wrap{padding-block:18px 24px}
  .update{text-align:left}
  .pass{grid-template-columns:1fr}
  .pass-main{padding:18px}
  .pass-stub{border-left:0;border-top:2px dashed var(--line);flex-direction:row;align-items:center;padding:16px 18px}
  .pass-stub::before,.pass-stub::after{top:-11px}
  .pass-stub::before{left:-11px}.pass-stub::after{left:auto;right:-11px;bottom:auto}
  .leg .pt b{font-size:34px}
  .leg .pt span{font-size:17px}
  .price-big{font-size:40px}
  .alts{grid-template-columns:1fr}
  .cols{display:none}
  .row>summary{grid-template-columns:1fr auto;gap:4px 12px;padding:13px 16px}
  .c-date{grid-column:1/-1}
  .c-time{grid-row:2}
  .c-price{grid-row:2;grid-column:2;align-self:start}
  .c-stop,.c-cie{grid-column:1/-1}
  .c-dur{display:none}
  .c-stop{display:block}
  .c-stop small{margin-left:6px}
  .chev{display:none}
  .sites{padding:2px 16px 14px}
  .notes{grid-template-columns:1fr;gap:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="sign">
  <div class="wrap">
    <a class="back" href="../">← Tous mes voyages</a>
    <div>
      <div class="eyebrow" id="eyebrow"></div>
      <h1 class="route" id="route"></h1>
      <p class="route-sub" id="sub"></p>
    </div>
    <div class="update">Prix relevés le<b id="upd"></b><span id="srcs"></span></div>
  </div>
</header>

<main>
  <div class="wrap">
    <section aria-labelledby="h-best">
      <h2 id="h-best">Le meilleur choix aujourd'hui</h2>
      <div id="best"></div>
      <div class="alts" id="alts"></div>
    </section>

    <section aria-labelledby="h-all">
      <h2 id="h-all">Tous les vols</h2>
      <div class="tools">
        <div class="days" id="days" role="group" aria-label="Jour de départ"></div>
        <div class="opts">
          <label><input type="checkbox" id="direct"> Directs seulement</label>
          <label><input type="checkbox" id="hors"> Afficher aussi les vols hors critères</label>
          <label>Trier par <select id="sort"><option value="prix">prix</option><option value="duree">durée</option><option value="depart">heure de départ</option></select></label>
        </div>
      </div>
      <p class="count" id="count" aria-live="polite"></p>
      <div class="board">
        <div class="cols" aria-hidden="true"><span>Jour</span><span>Horaires</span><span>Durée</span><span>Escale</span><span>Compagnie</span><span class="r">Prix / pers.</span><span></span></div>
        <div id="list"></div>
      </div>
    </section>

    <section aria-labelledby="h-evo" id="evo" hidden>
      <h2 id="h-evo">Évolution du meilleur prix</h2>
      <div class="chart"><div class="meta" id="evo-meta"></div><div id="evo-svg"></div></div>
    </section>

    <section aria-labelledby="h-info">
      <h2 id="h-info">À savoir avant de réserver</h2>
      <div class="notes" id="notes"></div>
    </section>

    <section aria-labelledby="h-links">
      <h2 id="h-links">Chercher soi-même</h2>
      <div class="links" id="links"></div>
    </section>

    <footer id="foot"></footer>
  </div>
</main>

const PR = DATA.projet;
const AR = PR.type === "ar";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const eur = n => Math.round(n).toLocaleString("fr-FR") + " €";
const dur = m => `${Math.floor(m/60)} h ${String(m%60).padStart(2,"0")}`;
const day = (d, o={weekday:"short",day:"numeric",month:"short"}) => new Date(d+"T12:00:00").toLocaleDateString("fr-FR", o);
const V = DATA.vols;
const ok = V.filter(v => v.ok);
const minBy = (a,f) => a.reduce((x,y) => f(y) < f(x) ? y : x);
const night = v => v.depart < "05:00";
const t = time => { const [h, plus] = String(time).split(" "); return esc(h) + (plus ? `<sup>${esc(plus)}</sup>` : ""); };
const prevDay = d => { const x = new Date(d+"T12:00:00"); x.setDate(x.getDate()-1); return x.toISOString().slice(0,10); };
const direct = v => v.escales === 0 && !(v.retour && v.retour.escales);
const total = v => PR.passagers > 1 ? `<small>${eur(v.prix_total)} pour ${PR.passagers}</small>` : "";
const o = PR.origine, d = PR.destination;

document.title = `${PR.nom} · ${o.code}-${d.code}`;
$("#eyebrow").textContent = `${PR.nom} · ${AR ? "aller-retour" : "aller simple"}`;
$("#route").innerHTML = `${esc(o.code)} <span class="arrow">${AR ? "⇄" : "→"}</span> ${esc(d.code)}`;
$("#route").setAttribute("aria-label", `${o.nom || o.code} ${AR ? "aller-retour" : "vers"} ${d.nom || d.code}`);
$("#sub").textContent = `${o.nom || o.code} → ${d.nom || d.code} · ${PR.resume}`;
const upd = DATA.releve.replace(/\s*\(.*\)$/, "").replace(" ", " à ");
$("#upd").textContent = upd;
$("#srcs").textContent = "sur " + String(DATA.sources);

const flags = v => [
  direct(v) ? '<span class="flag ok">Direct</span>' : "",
  night(v) ? `<span class="flag">Départ la nuit du ${day(prevDay(v.date), {day:"numeric"})} au ${day(v.date, {day:"numeric", month:"short"})}</span>` : "",
  v.autonome ? '<span class="flag">Billets séparés</span>' : "",
].join("");

function legHtml(v, small){
  const [a, b] = v.aeroports.split("-");
  const stops = (v.via || "").split(",").map(s => s.trim()).filter(Boolean);
  const dots = stops.map((s,i) => { const x = (i+1)/(stops.length+1)*100; return `<i style="left:${x}%"></i><em style="left:${x}%">${esc(s)}</em>`; }).join("");
  return `<div class="leg${small ? " small" : ""}">
    <div class="pt"><b>${esc(a)}</b><span class="mono">${t(v.depart)}</span></div>
    <div class="path" aria-hidden="true">${dots}<em class="dur">${dur(v.duree)}</em></div>
    <div class="pt end"><b>${esc(b)}</b><span class="mono">${t(v.arrivee)}</span></div>
  </div>`;
}
const escaleTxt = v => v.escales ? `${v.escales} escale${v.escales>1?"s":""} à ${esc(v.via)}${v.escale_detail ? " (" + esc(v.escale_detail) + ")" : ""}` : "Sans escale";

/* meilleur choix */
if (ok.length) {
  const cheap = minBy(ok, v => v.prix);
  const r = cheap.retour;
  $("#best").innerHTML = `
  <article class="pass">
    <div class="pass-main">
      <div>
        <span class="tag">Le moins cher · aller ${esc(day(cheap.date, {weekday:"long", day:"numeric", month:"long"}))}</span>
        ${legHtml(cheap)}
        <div class="facts"><span><b>${esc(cheap.compagnie)}</b></span><span>${escaleTxt(cheap)}</span>${night(cheap) ? flags({...cheap, escales:1, autonome:false}) : ""}</div>
      </div>
      ${r ? `<div><span class="tag">Retour · ${esc(day(r.date, {weekday:"long", day:"numeric", month:"long"}))}</span>${legHtml(r, true)}<div class="facts"><span>${escaleTxt(r)}</span></div></div>` : ""}
    </div>
    <div class="pass-stub">
      <div><div class="price-big">${eur(cheap.prix)}</div><div class="price-src">${PR.passagers > 1 ? `par personne, ${eur(cheap.prix_total)} pour ${PR.passagers}` : "trouvé"} sur ${esc(cheap.source)}</div></div>
      <a class="btn" href="${esc(cheap.lien)}" target="_blank" rel="noopener">Voir l'offre ↗</a>
    </div>
  </article>`;

  const value = v => v.prix + ((v.duree + (v.retour ? v.retour.duree : 0))/60)*25;
  const directs = ok.filter(direct);
  const fast = ok.filter(v => v !== cheap && !direct(v) && v.duree < cheap.duree);
  const alts = [];
  if (fast.length) alts.push(["Plus court avec escale", minBy(fast, value)]);
  if (directs.length && !direct(cheap)) alts.push(["Direct le moins cher", minBy(directs, v => v.prix)]);
  $("#alts").innerHTML = alts.map(([lab, v]) => `
    <article class="alt">
      <span class="tag t">${lab}</span>
      <div><div class="who">${esc(v.compagnie)}</div>
        <div class="det mono">${esc(day(v.date))} · ${esc(v.depart)} → ${esc(v.arrivee)}</div>
        <div class="det">${dur(v.duree)} · ${v.escales ? "escale à " + esc(v.via) : "sans escale"}${v.retour ? " · retour " + esc(day(v.retour.date)) : ""}</div></div>
      <div class="p">${eur(v.prix)}</div>
      <span></span><a href="${esc(v.lien)}" target="_blank" rel="noopener">Voir sur ${esc(v.source)} ↗</a>
    </article>`).join("");
} else {
  $("#best").innerHTML = '<p class="lede">Aucun vol ne respecte encore tous vos critères dans le dernier relevé. Cochez « Afficher aussi les vols hors critères » plus bas pour voir ce qui existe.</p>';
}

/* filtres */
const dates = [...new Set(V.map(v => v.date))].sort();
const st = { date: dates.includes(PR.date_aller) ? PR.date_aller : "tous", direct:false, hors:false, sort:"prix" };
const fromPrice = dd => { const a = ok.filter(v => dd === "tous" || v.date === dd); return a.length ? "dès " + eur(minBy(a, v => v.prix).prix) : "aucun"; };
$("#days").innerHTML = (dates.length > 1 ? [...dates, "tous"] : dates).map(dd => `<button class="day" type="button" data-d="${dd}" aria-pressed="${dd === st.date}">${dd === "tous" ? "Tous les jours" : esc(day(dd))}<small>${fromPrice(dd)}</small></button>`).join("");
$("#days").addEventListener("click", e => {
  const b = e.target.closest(".day"); if (!b) return;
  st.date = b.dataset.d;
  document.querySelectorAll(".day").forEach(x => x.setAttribute("aria-pressed", x === b));
  render();
});
for (const id of ["direct", "hors"]) $("#"+id).addEventListener("change", e => { st[id] = e.target.checked; render(); });
$("#sort").addEventListener("change", e => { st.sort = e.target.value; render(); });

function row(v){
  const r = v.retour;
  const stop = x => x.escales ? `<span>${esc(x.via)}${x.escale_detail ? ` <small>${esc(x.escale_detail)}</small>` : ""}</span>` : "<span>Direct</span>";
  const obs = [...v.obs].sort((a,b) => a.prix - b.prix);
  const sites = obs.map((s,i) => `<a class="site${i===0 && obs.length>1 ? " best" : ""}" href="${esc(s.lien)}" target="_blank" rel="noopener"><span>Voir sur ${esc(s.source)} ↗</span><b>${eur(s.prix)}</b></a>`).join("");
  return `<details class="row${v.ok ? "" : " off"}">
    <summary>
      <span class="c-date">${esc(day(v.date))}${r ? `<br>${esc(day(r.date))}` : ""}</span>
      <span class="c-time"><span>${t(v.depart)} → ${t(v.arrivee)}</span>${r ? `<span class="ret">${t(r.depart)} → ${t(r.arrivee)}</span>` : ""}</span>
      <span class="c-dur"><span>${dur(v.duree)}</span>${r ? `<span class="ret">${dur(r.duree)}</span>` : ""}</span>
      <span class="c-stop">${stop(v)}${r ? stop(r) : ""}</span>
      <span class="c-cie">${esc(v.compagnie)}<span class="flags">${flags(v)}</span></span>
      <span class="c-price"><b>${eur(v.prix)}</b>${total(v)}</span>
      <span class="chev" aria-hidden="true">›</span>
    </summary>
    <div class="sites">${sites}</div>
  </details>`;
}
function render(){
  const r = V.filter(v => (st.date === "tous" || v.date === st.date) && (st.hors || v.ok) && (!st.direct || direct(v)));
  const k = { prix: v => v.prix, duree: v => v.duree, depart: v => v.date + v.depart }[st.sort];
  r.sort((a,b) => (k(a) > k(b)) - (k(a) < k(b)) || a.prix - b.prix);
  $("#count").textContent = r.length ? `${r.length} vol${r.length>1?"s":""}. Touchez un vol pour comparer les sites.` : "";
  $("#list").innerHTML = r.length ? r.map(row).join("") : '<div class="empty">Aucun vol avec ces filtres.</div>';
}
render();

/* évolution du meilleur prix avec escale, par relevé */
const H = (DATA.histo || []).filter(h => h.escale || h.direct).map(h => ({...h, best: Math.min(...[h.escale, h.direct].filter(Boolean).map(x => x[0]))}));
if (H.length >= 2) {
  const W = 640, Ht = 150, P = {l:8, r:8, t:22, b:24};
  const ys = H.map(h => h.best);
  const lo = Math.min(...ys), hi = Math.max(...ys), pad = Math.max(10, (hi-lo)*0.2);
  const y = p => P.t + (1 - (p - (lo-pad)) / ((hi+pad) - (lo-pad))) * (Ht - P.t - P.b);
  const x = i => P.l + i * (W - P.l - P.r) / (H.length - 1);
  const pts = H.map((h,i) => [x(i), y(h.best)]);
  const line = pts.map((p,i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const area = line + ` L ${pts.at(-1)[0].toFixed(1)} ${Ht-P.b} L ${pts[0][0].toFixed(1)} ${Ht-P.b} Z`;
  const last = H.at(-1), first = H[0];
  $("#evo-svg").innerHTML = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Évolution du meilleur prix par personne">
    <line x1="${P.l}" x2="${W-P.r}" y1="${Ht-P.b}" y2="${Ht-P.b}" stroke="var(--line)"/>
    <path d="${area}" fill="var(--ink)" fill-opacity=".06"/>
    <path d="${line}" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round"/>
    ${pts.map(p => `<circle cx="${p[0]}" cy="${p[1]}" r="2.5" fill="var(--ink)"/>`).join("")}
    <circle cx="${pts.at(-1)[0]}" cy="${pts.at(-1)[1]}" r="5" fill="var(--surface)" stroke="var(--ink)" stroke-width="2"/>
    <text x="${pts.at(-1)[0]}" y="${pts.at(-1)[1]-10}" text-anchor="end" font-family="IBM Plex Mono, monospace" font-size="12" fill="var(--ink)">${eur(last.best)}</text>
    <text x="${P.l}" y="${Ht-6}" font-size="11" fill="var(--muted)" font-family="Inter, sans-serif">${esc(first.releve.slice(0,5))}</text>
    <text x="${W-P.r}" y="${Ht-6}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="Inter, sans-serif">${esc(last.releve.slice(0,5))}</text>
  </svg>`;
  const diff = last.best - first.best;
  $("#evo-meta").innerHTML = `<span>Dernier relevé <b>${eur(last.best)}</b></span><span>Plus bas relevé <b>${eur(lo)}</b></span><span>Depuis le début <b>${diff > 0 ? "+" : ""}${eur(diff)}</b></span>${last.direct ? `<span>Direct le moins cher <b>${eur(last.direct[0])}</b></span>` : ""}`;
  $("#evo").hidden = false;
}

/* conseils adaptés aux vols trouvés */
const notes = [["Les prix bougent", "Ils changent plusieurs fois par jour. Le bouton de chaque vol relance la recherche en direct sur le site, avec le prix du moment."]];
notes.push(["Billets séparés", "Certains trajets combinent deux billets indépendants. Si le premier vol a du retard, rien ne garantit le second. Ils sont exclus de vos critères sauf si vous les acceptez."]);
if (ok.some(v => /\b(PEK|PKX|PVG|SHA|CAN|CTU|XIY)\b/.test(v.via + " " + (v.retour ? v.retour.via : ""))))
  notes.push(["Escale en Chine", "Certains vols passent par la Chine continentale. Vérifiez les règles de transit pour votre passeport avant de réserver."]);
else notes.push(["Bagages", "Les prix affichés n'incluent pas toujours le bagage en soute. Vérifiez le tarif choisi sur le site avant de payer."]);
$("#notes").innerHTML = notes.map(([h,p]) => `<div><h3>${esc(h)}</h3><p>${esc(p)}</p></div>`).join("");

$("#links").innerHTML = DATA.liens.map(([n,u]) => `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(n)} ↗</a>`).join("");
$("#foot").textContent = `Prix par personne en classe ${PR.resume.split(" · ").find(s => /économique|premium|affaires|première/.test(s)) || "économique"}, taxes comprises, pour ${PR.passagers_txt}. Les bagages en soute ne sont pas toujours inclus. Cette page se met à jour automatiquement chaque jour, le dernier relevé date du ${upd}.`;
</script>
</body>
</html>
